# TD-MPC2 ハイパーパラメータ (UR3e PickCube 向け)
# 参考: Hansen et al., "TD-MPC2: Scalable, Robust World Models for Continuous Control"

# ── タスク ────────────────────────────────────────────────────────────────────
task: ur3e_pickcube
obs_dim: 34          # 観測次元 (ur3e_pickcube_env.py の OBS_DIM と一致)
action_dim: 7        # アクション次元 [dx,dy,dz,droll,dpitch,dyaw,gripper]
episode_length: 200  # 1エピソードの最大ステップ

# ── 学習スケジュール ───────────────────────────────────────────────────────────
steps: 1_000_000     # 総ステップ数
seed_steps: 5_000    # ランダム行動でバッファを埋めるステップ
eval_freq: 10_000    # 評価間隔
eval_episodes: 10    # 評価エピソード数
save_freq: 100_000   # チェックポイント保存間隔

# ── ネットワーク ───────────────────────────────────────────────────────────────
latent_dim: 512
mlp_dim: 512
num_enc_layers: 2
num_bins: 101        # 離散化ビン数 (SymLog)

# ── リプレイバッファ ────────────────────────────────────────────────────────────
buffer_size: 1_000_000
batch_size: 256
horizon: 3           # プランニングホライゾン

# ── 最適化 ───────────────────────────────────────────────────────────────────
lr: 3.0e-4
grad_clip_norm: 20.0
tau: 0.01            # ターゲットネットワーク更新率

# ── 探索 ─────────────────────────────────────────────────────────────────────
num_pi_trajs: 24     # ポリシートラジェクトリ数 (MPPI)
num_samples: 512     # サンプリング数
num_iterations: 6    # MPPI イテレーション数
temperature: 0.5     # MPPI 温度
momentum: 0.1        # MPPI モーメンタム
min_std: 0.05
max_std: 2.0

# ── 報酬・割引 ────────────────────────────────────────────────────────────────
discount: 0.99
rho: 0.5             # TD ターゲット混合率

# ── ログ ──────────────────────────────────────────────────────────────────────
wandb: true
wandb_project: ur3e-pickcube-rl
exp_name: tdmpc2_v1
checkpoint_dir: /opt/checkpoints/tdmpc2

# ── 並列環境 ─────────────────────────────────────────────────────────────────
num_envs: 8          # 並列環境数 (GPU メモリに応じて調整)
